<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pet Needle Comb – One Product Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #0066ff;
      --accent-hover: #0050d1;
      --muted: #666;
      --bg: #f5f7fb;
      --card-bg: #fff;
    }

    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      max-width: 1000px;
      width: 100%;
      display: flex;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      transition: transform 0.2s ease;
    }
    .card:hover { transform: translateY(-3px); }

    .left, .right { flex: 1; }
    .left img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .right {
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .price {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 12px;
    }

    p.description {
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .stock-note {
      font-size: 0.9rem;
      color: #888;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-controls button {
      width: 36px;
      height: 36px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      border-radius: 6px;
      font-size: 1.2rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .qty-controls button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .controls {
      display: flex;
      gap: 16px;
      margin-top: 20px;
    }

    .controls button {
      flex: 1;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .buy-now {
      background: var(--accent);
      color: #fff;
    }
    .buy-now:hover { background: var(--accent-hover); }

    .add-cart {
      background: #fff;
      border: 2px solid #ccc;
      color: #111;
    }
    .add-cart:hover { border-color: var(--accent); color: var(--accent); }

    #status {
      margin-top: 12px;
      font-weight: 600;
    }

    @media (max-width: 900px) {
      .card { flex-direction: column; }
      .left { min-height: 300px; }
    }

  </style>
</head>

<body>
  <div class="card">
    <div class="left">
      <img id="productImage" src="" alt="Product image">
    </div>
    <div class="right">
      <h1 id="productTitle">Loading…</h1>
      <div class="price" id="productPrice"></div>
      <p class="description" id="productDesc"></p>

      <div class="stock-note" id="stockNote"></div>

      <div class="qty-controls">
        <button id="decQty">-</button>
        <div id="qtyVal" style="min-width:36px; text-align:center;">1</div>
        <button id="incQty">+</button>
      </div>

      <div class="controls">
        <button class="buy-now" id="buyNowBtn">Buy Now</button>
      </div>

      <div id="status"></div>
    </div>
  </div>

<script>
(async function(){
  const productRes = await fetch('/product');
  if(!productRes.ok){
    document.getElementById('productTitle').textContent = 'Error loading product';
    return;
  }

  const product = await productRes.json();
  document.getElementById('productTitle').textContent = product.title;
  document.getElementById('productDesc').textContent = product.description;
  document.getElementById('productPrice').textContent = '$' + (product.price/100).toFixed(2);
  document.getElementById('productImage').src = product.imageUrl;
  document.getElementById('stockNote').textContent = product.inventory > 0 ? product.inventory + ' left in stock' : 'Out of stock';

  let qty = 1;
  const qtyVal = document.getElementById('qtyVal');
  document.getElementById('incQty').addEventListener('click', ()=>{ if(qty < product.inventory) qty++; qtyVal.textContent=qty; });
  document.getElementById('decQty').addEventListener('click', ()=>{ if(qty>1) qty--; qtyVal.textContent=qty; });

  document.getElementById('buyNowBtn').addEventListener('click', async ()=>{
    if(product.inventory === 0){ alert('Product out of stock'); return; }
    document.getElementById('status').textContent = 'Redirecting to checkout…';
    const res = await fetch('/create-checkout-session', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ 
        productId: product.id, 
        quantity: qty, 
        successUrl: window.location.href + '?success=1', 
        cancelUrl: window.location.href + '?canceled=1' 
      })
    });
    const {url, error} = await res.json();
    if(error){ document.getElementById('status').textContent = 'Error: ' + error; return; }
    window.location = url;
  });

  document.getElementById('addCartBtn').addEventListener('click', ()=>{ alert('Added to cart (demo)'); });
})();
</script>
</body>
</html>
